<!doctype html>
<html lang="en">
  <head>
    <!-- Meta + Title -->
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>DUO+ | Chiropractor</title>
    <script src="../js/pinCode.js"></script>
    <link rel="icon" type="image/x-icon" href="../assets/favicon.ico" />

    <!-- Styles -->
    <link href="../assets/css/hope-ui.min.css" rel="stylesheet" />
    <link href="../assets/css/custom.css" rel="stylesheet" />
    <link
      href="../assets/css/bootstrap-icons-1.13.1/bootstrap-icons.css"
      rel="stylesheet"
    />
  </head>

  <body class="food-truck-page">
    <div class="container-fluid p-0">
      <!-- Container -->
      <main class="container food-truck-shell">
        <div class="row justify-content-center">
          <div class="col-12 col-md-10 col-lg-9 col-xl-8">
            <!-- Logo -->
            <div class="text-center mb-4">
              <img
                src="../assets/images/DUOvolunteerlogo.png"
                alt="Logo"
                width="168"
              />
            </div>

            <!-- Main card with blue header -->
            <div class="food-truck-backdrop rounded-4 p-1 p-md-2">
              <section class="card border-0 rounded-4 overflow-hidden">
                <header class="bg-primary text-white px-4 py-3">
                  <h1 class="h4 mb-0 text-white">Chiropractor</h1>
                </header>

                <div class="card-body p-4 bg-white">
                  <!-- Chiropractor counter summaries -->

                  <!-- Clients served counter -->
                  <div class="row g-3 mb-4">
                    <div class="col-12 col-md-6">
                      <h2 class="h6 text-primary fw-semibold mb-2">
                        Chiropractor Clients Served
                      </h2>
                      <div
                        class="d-flex align-items-center justify-content-between rounded-pill border shadow-sm px-3 py-2"
                      >
                        <i
                          class="bi bi-person-standing fs-3 text-dark"
                          aria-hidden="true"
                        ></i>
                        <span
                          id="chiropractorClientsServed"
                          class="h2 fw-bold text-dark mb-0"
                          aria-live="polite"
                          >0</span
                        >
                      </div>
                    </div>

                    <!-- Volunteers served counter -->
                    <div class="col-12 col-md-6">
                      <h2 class="h6 text-primary fw-semibold mb-2">
                        Chiropractor Volunteers Served
                      </h2>
                      <div
                        class="d-flex align-items-center justify-content-between rounded-pill border shadow-sm px-3 py-2"
                      >
                        <i
                          class="bi bi-people fs-3 text-dark"
                          aria-hidden="true"
                        ></i>
                        <span
                          id="chiropractorVolunteersServed"
                          class="h2 fw-bold text-dark mb-0"
                          aria-live="polite"
                          >0</span
                        >
                      </div>
                    </div>
                  </div>

                  <!-- Blue bars with left minus and right plus controls -->

                  <!-- Clients served buttons -->
                  <div
                    class="btn-primary rounded-pill d-flex align-items-center justify-content-between px-3 py-2 mb-3"
                    role="group"
                    aria-label="Clients served controls"
                  >
                    <button
                      id="chiropractorClientsMinus"
                      class="btn p-0 border-0 bg-transparent text-white fs-3 lh-1 d-inline-flex align-items-center justify-content-center"
                      type="button"
                      aria-label="Decrease chiropractor clients served"
                    >
                      <i class="bi bi-dash-circle-fill" aria-hidden="true"></i
                      ><span class="visually-hidden">Decrease</span>
                    </button>
                    <span class="small">Chiropractor Clients Served</span>
                    <button
                      id="chiropractorClientsPlus"
                      class="btn p-0 border-0 bg-transparent text-white fs-3 lh-1 d-inline-flex align-items-center justify-content-center"
                      type="button"
                      aria-label="Increase chiropractor clients served"
                    >
                      <i class="bi bi-plus-circle-fill" aria-hidden="true"></i
                      ><span class="visually-hidden">Increase</span>
                    </button>
                  </div>

                  <!-- Volunteers served buttons -->
                  <div
                    class="btn-primary rounded-pill d-flex align-items-center justify-content-between px-3 py-2"
                    role="group"
                    aria-label="Volunteers served controls"
                  >
                    <button
                      id="chiropractorVolunteersMinus"
                      class="btn p-0 border-0 bg-transparent text-white fs-3 lh-1 d-inline-flex align-items-center justify-content-center"
                      type="button"
                      aria-label="Decrease chiropractor volunteers served"
                    >
                      <i class="bi bi-dash-circle-fill" aria-hidden="true"></i
                      ><span class="visually-hidden">Decrease</span>
                    </button>
                    <span class="small">Chiropractor Volunteers Served</span>
                    <button
                      id="chiropractorVolunteersPlus"
                      class="btn p-0 border-0 bg-transparent text-white fs-3 lh-1 d-inline-flex align-items-center justify-content-center"
                      type="button"
                      aria-label="Increase chiropractor volunteers served"
                    >
                      <i class="bi bi-plus-circle-fill" aria-hidden="true"></i
                      ><span class="visually-hidden">Increase</span>
                    </button>
                  </div>

                  <!-- Status text for autosave and manual saving -->
                  <p
                    id="chiropractorStatus"
                    class="small text-muted mt-3 mb-0"
                    aria-live="polite"
                  ></p>
                </div>
              </section>
            </div>
          </div>
        </div>
      </main>
    </div>

    <!-- Scripts -->
    <script src="../assets/js/alerts/sweetalert2.all.min.js"></script>
    <script src="../assets/js/core/libs.min.js"></script>
    <script src="../assets/js/hope-ui.js"></script>
    <script src="../js/chiropractor.js"></script>
  </body>
</html>
